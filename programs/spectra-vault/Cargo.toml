[package]
name = "spectra-vault"
version = "0.1.0"
description = "Spectra Vaults — prediction market ETF vaults on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spectra_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token-2022"] }
