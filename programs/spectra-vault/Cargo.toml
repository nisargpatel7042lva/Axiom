[package]
name = "spectra-vault"
version = "0.1.0"
description = "Spectra Vaults — prediction market ETFs on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spectra_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
# Pin transitive deps to edition2021-compatible versions (platform-tools v1.51 cargo 1.84)
proc-macro-crate = ">=3.0, <3.4"
blake3 = ">=1.3, <1.8"
digest = ">=0.10, <0.11"
crypto-common = ">=0.1, <0.2"
